<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Define a cube path for reuse if I could, but simple enough to draw a few -->
  
  <!-- Back/Bottom layer -->
  <path d="M32 34 L16 26 L16 38 L32 46 Z" fill="#90A4AE" stroke="#546E7A" stroke-width="1"/>
  <path d="M32 34 L48 26 L48 38 L32 46 Z" fill="#78909C" stroke="#546E7A" stroke-width="1"/>
  <path d="M16 26 L32 18 L48 26 L32 34 Z" fill="#B0BEC5" stroke="#546E7A" stroke-width="1"/>

  <!-- Top/Front layer - floating voxel -->
  <path d="M32 20 L16 12 L16 24 L32 32 Z" fill="#4FC3F7" stroke="#0277BD" stroke-width="1"/>
  <path d="M32 20 L48 12 L48 24 L32 32 Z" fill="#29B6F6" stroke="#0277BD" stroke-width="1"/>
  <path d="M16 12 L32 4 L48 12 L32 20 Z" fill="#81D4FA" stroke="#0277BD" stroke-width="1"/>

  <!-- Another voxel to the side/bottom -->
  <path d="M48 42 L32 34 L32 46 L48 54 Z" fill="#00BCD4" stroke="#00838F" stroke-width="1"/>
  <path d="M48 42 L64 34 L64 46 L48 54 Z" fill="#00ACC1" stroke="#00838F" stroke-width="1"/>
  <path d="M32 34 L48 26 L64 34 L48 42 Z" fill="#26C6DA" stroke="#00838F" stroke-width="1"/>
  
  <!-- Wireframe grid hint -->
  <line x1="8" y1="40" x2="24" y2="48" stroke="#CFD8DC" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="24" y1="48" x2="56" y2="32" stroke="#CFD8DC" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="24" y1="48" x2="24" y2="60" stroke="#CFD8DC" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
